<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>喜马主播榜 Demo</title>
    <style>
:root {
  --red: #ff3b44;
  --red-deep: #7f0012;
  --ink: #23242a;
  --muted: #83858d;
  --line: #f0f1f4;
  --panel: #ffffff;
  --soft: #f7f8fb;
  --gold: #f7b642;
  --silver: #b8c1cc;
  --bronze: #d57c48;
}

* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  margin: 0;
  display: grid;
  place-items: center;
  background: #e9ebf1;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}

button {
  border: 0;
  font: inherit;
}

.phone-shell {
  width: min(430px, 100vw);
  min-height: 100vh;
  background: #111;
}

.app-screen {
  min-height: 100vh;
  overflow: hidden;
  background: var(--soft);
}

.hero {
  position: relative;
  padding: 18px 16px 0;
  color: #fff;
  background:
    radial-gradient(circle at 14% 0%, rgba(255, 63, 83, 0.42), transparent 24%),
    radial-gradient(circle at 96% 72%, rgba(255, 40, 55, 0.32), transparent 23%),
    linear-gradient(145deg, #220007 0%, #100003 52%, #36000a 100%);
}

.statusbar,
.topbar,
.tabbar {
  display: flex;
  align-items: center;
}

.statusbar {
  justify-content: space-between;
  padding: 2px 4px 18px;
  font-size: 15px;
  font-weight: 700;
}

.status-icons {
  font-size: 12px;
  opacity: 0.86;
}

.topbar {
  justify-content: space-between;
}

.topbar h1 {
  margin: 0;
  font-size: 31px;
  line-height: 1;
  letter-spacing: 0;
}

.topbar h1::before,
.topbar h1::after {
  content: "‹";
  display: inline-block;
  margin: 0 10px;
  color: rgba(255, 255, 255, 0.74);
  font-size: 28px;
  transform: rotate(-28deg);
}

.topbar h1::after {
  transform: rotate(208deg);
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 18px;
  color: #fff;
  background: rgba(255, 255, 255, 0.08);
  font-size: 28px;
  line-height: 1;
}

.hero-copy {
  padding: 24px 4px 16px;
}

.hero-copy .eyebrow {
  margin: 0 0 8px;
  color: rgba(255, 255, 255, 0.68);
  font-size: 12px;
}

.hero-copy h2 {
  margin: 0;
  font-size: 24px;
  line-height: 1.2;
}

.hero-copy p:last-child {
  margin: 8px 0 0;
  color: rgba(255, 255, 255, 0.72);
  font-size: 13px;
}

.tabbar {
  gap: 22px;
  overflow-x: auto;
  padding: 8px 2px 12px;
  scrollbar-width: none;
}

.tabbar::-webkit-scrollbar {
  display: none;
}

.tab {
  position: relative;
  flex: 0 0 auto;
  padding: 8px 0 10px;
  color: rgba(255, 255, 255, 0.72);
  background: transparent;
  font-size: 17px;
  font-weight: 600;
  white-space: nowrap;
}

.tab.active {
  color: #fff;
}

.tab.active::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 24px;
  height: 4px;
  border-radius: 2px;
  background: var(--red);
  transform: translateX(-50%);
}

.content-panel {
  min-height: calc(100vh - 230px);
  margin-top: -2px;
  border-radius: 18px 18px 0 0;
  background: var(--panel);
  overflow: hidden;
}

.notice {
  margin: 0;
  padding: 14px 18px 11px;
  color: #a0a2aa;
  font-size: 13px;
  border-bottom: 1px solid var(--line);
}

.notice:empty {
  display: none;
}

.rail-layout {
  display: grid;
  grid-template-columns: 86px minmax(0, 1fr);
  min-height: calc(100vh - 284px);
}

.side-rail {
  background: #f5f6f8;
  border-right: 1px solid #eceef2;
}

.rail-item {
  position: relative;
  width: 100%;
  min-height: 58px;
  padding: 0 10px;
  color: #8b8d94;
  background: transparent;
  font-size: 14px;
  line-height: 1.25;
}

.rail-item.active {
  color: var(--red);
  background: #fff;
  font-weight: 700;
}

.rail-item.active::before {
  content: "";
  position: absolute;
  left: 0;
  top: 18px;
  width: 4px;
  height: 22px;
  border-radius: 0 4px 4px 0;
  background: var(--red);
}

.rank-area {
  min-width: 0;
  padding: 16px 0 30px;
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 16px 12px;
}

.label {
  margin: 0 0 4px;
  color: var(--muted);
  font-size: 12px;
}

.label:empty {
  display: none;
}

.section-head h3 {
  margin: 0;
  font-size: 21px;
  line-height: 1.15;
}

.rule-btn {
  flex: 0 0 auto;
  padding: 7px 11px;
  border-radius: 16px;
  color: var(--red);
  background: #fff1f2;
  font-size: 13px;
  font-weight: 700;
}

.rule-card {
  display: none;
  margin: 0 16px 14px;
  padding: 12px;
  border: 1px solid #ffe0e3;
  border-radius: 8px;
  background: #fff8f8;
  color: #5b4549;
  font-size: 12px;
  line-height: 1.6;
}

.rule-card.show {
  display: block;
}

.podium {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  padding: 0 12px 14px;
}

.podium-card {
  min-width: 0;
  padding: 10px 8px;
  border: 1px solid #f1e8de;
  border-radius: 8px;
  background: linear-gradient(180deg, #fffaf2 0%, #fff 100%);
  text-align: center;
}

.podium-card:nth-child(2) {
  transform: translateY(10px);
}

.podium-card:nth-child(3) {
  transform: translateY(16px);
}

.avatar {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  margin: 0 auto 7px;
  border-radius: 50%;
  color: #fff;
  font-weight: 800;
  background: linear-gradient(135deg, #ff5158, #ffb54b);
  box-shadow: 0 8px 18px rgba(190, 36, 44, 0.16);
}

.podium-rank {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 20px;
  margin-bottom: 5px;
  border-radius: 10px;
  color: #fff;
  background: var(--gold);
  font-size: 12px;
  font-weight: 800;
}

.podium-card:nth-child(2) .podium-rank {
  background: var(--silver);
}

.podium-card:nth-child(3) .podium-rank {
  background: var(--bronze);
}

.podium-name {
  overflow: hidden;
  margin: 0;
  font-size: 13px;
  font-weight: 800;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.podium-meta {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 11px;
}

.rank-list {
  border-top: 1px solid var(--line);
}

.rank-row {
  display: grid;
  grid-template-columns: 36px 58px minmax(0, 1fr);
  gap: 9px;
  padding: 14px 16px 13px;
  border-bottom: 1px solid var(--line);
}

.rank-num {
  align-self: center;
  color: #9699a1;
  font-size: 18px;
  font-weight: 800;
  text-align: center;
}

.rank-row:nth-child(1) .rank-num,
.rank-row:nth-child(2) .rank-num,
.rank-row:nth-child(3) .rank-num {
  color: var(--red);
}

.row-main {
  min-width: 0;
}

.name-line,
.metric-line {
  display: flex;
  align-items: center;
  min-width: 0;
}

.name-line {
  gap: 6px;
  margin-bottom: 4px;
}

.name {
  overflow: hidden;
  font-size: 16px;
  font-weight: 800;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.badge {
  flex: 0 0 auto;
  padding: 2px 6px;
  border-radius: 10px;
  color: #fff;
  background: #8967ff;
  font-size: 10px;
  font-weight: 800;
}

.desc {
  overflow: hidden;
  margin: 0 0 8px;
  color: #767982;
  font-size: 13px;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.metric-line {
  flex-wrap: wrap;
  gap: 6px;
  color: #9a9da5;
  font-size: 12px;
}

.metric-chip {
  padding: 3px 7px;
  border-radius: 12px;
  background: #f5f6f8;
}

.empty {
  margin: 10px 16px;
  padding: 26px 18px;
  border: 1px dashed #dedfe4;
  border-radius: 8px;
  background: #fafbfc;
  color: #787b84;
  font-size: 14px;
  line-height: 1.7;
}

@media (max-width: 360px) {
  .rail-layout {
    grid-template-columns: 76px minmax(0, 1fr);
  }

  .rank-row {
    grid-template-columns: 30px 48px minmax(0, 1fr);
    gap: 7px;
    padding-left: 12px;
    padding-right: 12px;
  }

  .avatar {
    width: 48px;
    height: 48px;
  }
}

function avatarText(name) {
  return name.replace(/[A-Za-z0-9]/g, "").slice(0, 2) || name.slice(0, 2);
}

function rowMatches(row, rail) {
  if (rail === "全站") return true;
  return row[2].includes(rail) || row[1].includes(rail);
}

function rowsForCurrentView() {
  const data = rankData[activeTab];
  if (activeTab === "category") return data.groups[activeRail] || [];
  return data.rows.filter((row) => rowMatches(row, activeRail));
}

function displayMetrics(row, index) {
  const rowMetrics = row.slice(4, 7).filter(Boolean);
  const lift = [36, 31, 28, 24, 21, 19, 17, 15, 13, 11, 9, 8][index] || 6;

  if (rowMetrics.includes("新上榜")) {
    return [`影响力 +${lift}%`, "新上榜"];
  }

  if (rowMetrics.length) return rowMetrics;

  return [`影响力 +${lift}%`];
}

function ruleText() {
  if (activeTab === "main") {
    return "计算维度：有效播放时长 15% + EDAU 15% + 分享量 15% + 新增关注量 15% + 收入 40%。基础得分 = 40% × 全局得分 + 60% × 品类得分；最终得分 = 基础得分 × 小品类系数。";
  }
  if (activeTab === "growth") {
    return "计算维度：收入增长率 + EDAU 增长率。基础得分 = 40% × 全局得分 + 60% × 品类得分；最终得分 = 基础得分 × 小品类系数。";
  }
  return "计算维度：有效播放 + 新增订阅。最终得分 = 60% × 细分类目得分 + 40% × 一级品类得分。";
}

function renderTabs() {
  rankTabs.innerHTML = tabs.map(([key, label]) => (
    `<button class="tab ${key === activeTab ? "active" : ""}" type="button" data-tab="${key}">${label}</button>`
  )).join("");
}

function renderRail(data) {
  sideRail.innerHTML = data.rail.map((item) => (
    `<button class="rail-item ${item === activeRail ? "active" : ""}" type="button" data-rail="${item}">${item}</button>`
  )).join("");
}

function renderPodium(rows) {
  podium.innerHTML = rows.slice(0, 3).map((row, index) => (
    `<article class="podium-card">
      <span class="podium-rank">TOP${index + 1}</span>
      <div class="avatar">${avatarText(row[0])}</div>
      <p class="podium-name">${row[0]}</p>
    </article>`
  )).join("");
}

function renderRows(rows) {
  if (!rows.length) {
    rankList.innerHTML = `<div class="empty">播客榜数据还未准备好。建议在此保留入口，展示“数据建设中”状态，并在品类字段、圈选逻辑和运营承接方案确定后自动切换为榜单列表。</div>`;
    return;
  }

  rankList.innerHTML = rows.map((row, index) => {
    const chips = displayMetrics(row, index).map((metric) => (
      `<span class="metric-chip">${metric}</span>`
    )).join("");
    const metricLine = chips ? `<div class="metric-line">${chips}</div>` : "";
    return `<article class="rank-row">
      <div class="rank-num">${index + 1}</div>
      <div class="avatar">${avatarText(row[0])}</div>
      <div class="row-main">
        <div class="name-line">
          <span class="name">${row[0]}</span>
        </div>
        ${metricLine}
      </div>
    </article>`;
  }).join("");
}

function render() {
  renderTabs();

  const data = rankData[activeTab];
  if (!data.rail.includes(activeRail)) activeRail = data.rail[0];
  const rows = rowsForCurrentView();

  notice.textContent = data.notice;
  rankCycle.textContent = data.cycle;
  rankTitle.textContent = activeTab === "category" ? `${activeRail}榜` : data.title;
  ruleCard.textContent = ruleText();
  ruleCard.classList.toggle("show", rulesVisible);
  renderRail(data);
  renderPodium(rows);
  renderRows(rows);
}

rankTabs.addEventListener("click", (event) => {
  const button = event.target.closest("[data-tab]");
  if (!button) return;
  activeTab = button.dataset.tab;
  rulesVisible = false;
  activeRail = activeTab === "category" ? "故事演绎" : "全站";
  render();
});

sideRail.addEventListener("click", (event) => {
  const button = event.target.closest("[data-rail]");
  if (!button) return;
  activeRail = button.dataset.rail;
  render();
});

ruleToggle.addEventListener("click", () => {
  rulesVisible = !rulesVisible;
  render();
});

render();

    </script>
  </body>
</html>
