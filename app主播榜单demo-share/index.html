<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>喜马主播榜 Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="phone-shell">
      <section class="app-screen">
        <header class="hero">
          <div class="statusbar">
            <span>14:28</span>
            <span class="status-icons">▮▮▮  WiFi  56</span>
          </div>
          <nav class="topbar" aria-label="页面导航">
            <button class="icon-btn" type="button" aria-label="返回">‹</button>
            <h1>主播榜</h1>
            <button class="icon-btn" type="button" aria-label="分享">↗</button>
          </nav>
          <div class="hero-copy">
            <p class="eyebrow">喜马创作者生态周榜</p>
            <h2>看见影响力，也看见上升力</h2>
            <p>每周更新 · 剔除异常数据 · 主播可查明细</p>
          </div>
          <div class="tabbar" id="rankTabs" role="tablist" aria-label="榜单切换"></div>
        </header>

        <section class="content-panel">
          <div class="notice" id="notice"></div>
          <div class="rail-layout">
            <aside class="side-rail" id="sideRail" aria-label="榜单分类"></aside>
            <section class="rank-area">
              <div class="section-head">
                <div>
                  <p class="label" id="rankCycle"></p>
                  <h3 id="rankTitle"></h3>
                </div>
                <button class="rule-btn" id="ruleToggle" type="button">规则</button>
              </div>

              <div class="rule-card" id="ruleCard"></div>
              <div class="podium" id="podium"></div>
              <div class="rank-list" id="rankList"></div>
            </section>
          </div>
        </section>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
